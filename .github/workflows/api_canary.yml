name: API Canary

# Phase 9 Task 60. Two independent, low-impact tiers, distinct from the
# per-PR smoke_tests job (ci.yml) and the full nightly integration_tests.yml:
#
# - read_canary: a handful of pure-read Cloud checks (CanaryRead tag), run
#   frequently, to catch a Cloud contract change (a field disappearing, a
#   route shape changing) fast, well before a user reports it.
# - write_canary: one bounded create -> read -> update -> delete -> confirm
#   lifecycle against a single disposable issue (CanaryWrite tag, see
#   Tests/Integration/ApiCanary.Integration.Tests.ps1), run on a slower,
#   off-peak cadence separate from the nightly full-suite writes.
#
# Both tiers use a dedicated, least-privilege canary account
# (ATLASSIAN_CANARY_USER / ATLASSIAN_CANARY_PAT) rather than the shared
# ATLASSIAN_CLOUD_PAT the smoke/nightly jobs use, and publish a
# machine-readable result per operation (AtlassianPS.Standards'
# ConvertTo-ApiCanaryResult) as a workflow artifact.
#
# SETUP REQUIRED before either schedule can run green: create a dedicated,
# least-privilege Jira Cloud account/API token for the canary (do not reuse
# the smoke/nightly account) and add it as the ATLASSIAN_CANARY_USER
# repository variable and ATLASSIAN_CANARY_PAT repository secret. Until then,
# both jobs fail fast on the "missing environment variables" check inside
# Invoke-Build -Task TestIntegration with an actionable message, rather than
# silently skipping or falsely reporting green.
on:
  schedule:
    # Read canary: every 4 hours.
    - cron: "0 */4 * * *"
    # Write-lifecycle canary: once daily, offset from smoke_tests (every PR),
    # integration_tests.yml's nightly full suite (05:00 UTC), and the other
    # read_canary runs, to keep quota usage spread out.
    - cron: "40 11 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: "Which canary tier to run"
        required: false
        default: both
        type: choice
        options:
          - read
          - write
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read_canary:
    name: Read Canary (Cloud)
    if: (github.event_name == 'schedule' && github.event.schedule == '0 */4 * * *' && github.repository == 'AtlassianPS/JiraPS') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.track == 'read' || inputs.track == 'both'))
    runs-on: ubuntu-latest
    # Bounded: a handful of read operations against a live tenant should
    # never legitimately take this long; a hang is a real signal.
    timeout-minutes: 15
    env:
      JIRA_CLOUD_URL: ${{ vars.JIRA_CLOUD_URL }}
      JIRA_CLOUD_USERNAME: ${{ vars.ATLASSIAN_CANARY_USER }}
      JIRA_CLOUD_PASSWORD: ${{ secrets.ATLASSIAN_CANARY_PAT }}
      JIRA_TEST_PROJECT: ${{ vars.JIRA_TEST_PROJECT }}
      JIRA_TEST_ISSUE: ${{ vars.JIRA_TEST_ISSUE }}
      JIRA_TEST_FILTER: ${{ vars.JIRA_TEST_FILTER }}
    steps:
      - uses: actions/checkout@v6
      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/setup-powershell@6fe5d05db84cdd10c9e4284e235a8f359c9537ad # v0.1.11

      - name: Run read-only API canaries
        run: |
          Invoke-Build -Task TestIntegration -Tag 'CanaryRead' -PesterVerbosity Detailed
        shell: pwsh

      - name: Publish machine-readable canary results
        if: always()
        run: ./Tools/Publish-ApiCanaryResult.ps1 -ResultXmlPath 'Test-Integration.xml' -Repository 'JiraPS' -DeploymentType 'Cloud' -OutputPath 'api-canary-read-results.json'
        shell: pwsh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Read-Canary-Results
          path: |
            Test-Integration.xml
            api-canary-read-results.json

  write_canary:
    name: Write-Lifecycle Canary (Cloud)
    if: (github.event_name == 'schedule' && github.event.schedule == '40 11 * * *' && github.repository == 'AtlassianPS/JiraPS') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.track == 'write' || inputs.track == 'both'))
    runs-on: ubuntu-latest
    # Bounded: one create/read/update/delete cycle. A hang here means the
    # lifecycle is stuck, not that more time would help.
    timeout-minutes: 15
    env:
      JIRA_CLOUD_URL: ${{ vars.JIRA_CLOUD_URL }}
      JIRA_CLOUD_USERNAME: ${{ vars.ATLASSIAN_CANARY_USER }}
      JIRA_CLOUD_PASSWORD: ${{ secrets.ATLASSIAN_CANARY_PAT }}
      JIRA_TEST_PROJECT: ${{ vars.JIRA_TEST_PROJECT }}
      JIRA_TEST_ISSUE: ${{ vars.JIRA_TEST_ISSUE }}
    steps:
      - uses: actions/checkout@v6
      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/setup-powershell@6fe5d05db84cdd10c9e4284e235a8f359c9537ad # v0.1.11

      - name: Run write-lifecycle API canary
        run: |
          Invoke-Build -Task TestIntegration -Tag 'CanaryWrite' -PesterVerbosity Detailed
        shell: pwsh

      - name: Publish machine-readable canary results
        if: always()
        run: ./Tools/Publish-ApiCanaryResult.ps1 -ResultXmlPath 'Test-Integration.xml' -Repository 'JiraPS' -DeploymentType 'Cloud' -OutputPath 'api-canary-write-results.json'
        shell: pwsh

      # No separate guaranteed-cleanup step here: Tests/Integration/ApiCanary's
      # own AfterAll (best-effort, matching every other integration test file)
      # plus Remove-StaleTestResource, which every integration test file --
      # including this one, via its shared BeforeDiscovery/BeforeAll template --
      # already runs at the START of its own run, self-heals any leftover
      # canary issue on the next run regardless of how this one ended.

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Write-Canary-Results
          path: |
            Test-Integration.xml
            api-canary-write-results.json
